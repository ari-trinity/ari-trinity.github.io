<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>You Da Bomb 💣</title>
	<link rel="stylesheet" href="styles.css" />
	<!-- Font Awesome for icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
	<!-- Google Font -->
	<link
		href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel+Decorative:wght@700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap"
		rel="stylesheet" />
</head>

<body>

	<!-- ========== PAGE 1: Greeting ========== -->
	<div class="page active" id="page1">
		<div class="bubbles" id="bubbles1"></div>

		<div class="card" id="card1">
			<h1 class="title">The Universe Has Been Expecting You</h1>
			<p class="subtitle">Go ahead, introduce yourself.</p>

			<div class="input-wrap">
				<div class="input-decoration"><span>✦ ✦ ✦</span></div>
				<input type="text" id="nameInput" placeholder="Name" maxlength="30" />
			</div>

			<button class="btn" id="nextBtn" onclick="goToPage2()">
				Let's Go →
			</button>

			<div class="rainbow-bounce"></div>
		</div>
	</div>

	<!-- ========== PAGE 2: Rainbow Swirls ========== -->
	<div class="page" id="page2">
		<div class="bubbles" id="bubbles2"></div>

		<div class="card swirl-card" id="card2">
			<label class="swirl-label" id="loveLabel">I'm so happy you're here!</label>
			<p class="option-prompt">Would you like a good laugh or an ego boost? Choose below:</p>
			<div class="btn-row">
				<button class="btn ego-btn" onclick="generateCompliment()">
					Hype Me Up
				</button>
				<button class="btn ego-btn laugh-btn" onclick="generateCompliment()">
					Make Me Laugh
				</button>
			</div>
			<button class="btn celebrate-btn" onclick="goToPage3()">
				This One's For You
			</button>
		</div>
	</div>

	<!-- ========== PAGE 3: Celebration ========== -->
	<div class="page" id="page3">
		<canvas id="confettiCanvas"></canvas>

		<div class="bomb-card" id="bombCard">
			<h1 class="bomb-text" id="bombText">Go Seize the Day,</h1>
			<p class="bomb-reason" id="bombReason"></p>
			<button class="btn restart-btn" onclick="restart()">
				Start Over <i class="fa-solid fa-rotate-right"></i>
			</button>
		</div>
	</div>

	<script src="script.js"></script>
</body>

</html>
